# Netlify 設定：新版 Next.js 站（位於 repo 的 web/ 子目錄）
# 這是新版預覽用的設定，與舊正式站（repo 根目錄、populove.org）完全分開。
# 建置前先清掉 Netlify 還原的舊快取（node_modules 與 .next），
# 強制以 hoisted（扁平、無符號連結）方式重裝再 build。
# 原因：舊快取殘留 pnpm 符號連結，會害 @netlify/plugin-nextjs 複製相依時
# 報 ERR_FS_CP_DIR_TO_NON_DIR（standalone/node_modules/next 衝突）。
[build]
  command = "rm -rf node_modules .next && pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"

# 官方 Next.js Runtime：自動處理 SSR、API routes 等動態功能。
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
