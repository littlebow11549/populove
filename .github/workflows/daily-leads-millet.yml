name: 每日獲客名單(小米酒)

on:
  schedule:
    # UTC 01:41 = 台北時間 09:41,每天執行(與團體製服系統的 09:23 錯開)
    - cron: '41 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 隱私安全鎖:repo 公開時不執行(名單屬客戶資料,不得公開)
        id: privacy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIVATE=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          echo "private=${PRIVATE}" >> "$GITHUB_OUTPUT"
          if [ "$PRIVATE" != "true" ]; then
            echo "::warning::repo 目前是公開的,為保護客戶名單,今天不產生/發佈名單。請到 Settings → Danger Zone → Change visibility 改成 Private。"
          fi

      - uses: actions/checkout@v4
        if: steps.privacy.outputs.private == 'true'

      - uses: actions/setup-python@v5
        if: steps.privacy.outputs.private == 'true'
        with:
          python-version: '3.12'

      - name: 產生名單並寄信
        if: steps.privacy.outputs.private == 'true'
        working-directory: leadgen
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          LEADS_TO_EMAIL: derrick.populove@gmail.com
        run: python millet_wine_leads.py

      - name: 發佈報告到 GitHub Issue(自動通知,免設定)
        if: steps.privacy.outputs.private == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f leadgen/out/millet_issue_body.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$(cat leadgen/out/millet_issue_title.txt)" \
              --body-file leadgen/out/millet_issue_body.md \
              --assignee "${GITHUB_REPOSITORY_OWNER}"
          fi

      - name: 保留報告副本(14 天)
        if: steps.privacy.outputs.private == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: millet-leads-report
          path: leadgen/out/
          retention-days: 14
          if-no-files-found: ignore
